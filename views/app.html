<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./main.css" />
		<script
			src="https://kit.fontawesome.com/cfb8583f4c.js"
			crossorigin="anonymous"
		></script>
		<title>AnkiQuestions</title>
	</head>
	<body>
		<section id="sidebar" class="hide">
			<div class="sidebar__icons">
				<i class="icon fa-solid fa-bars"></i>
				<i class="icon fa-solid fa-house"></i>
				<i class="icon fa-solid fa-file"></i>
				<i class="icon fa-solid fa-pen"></i>
				<!-- 				<i class="icon fa-solid fa-magnifying-glass"></i> -->
				<!-- 				<i class="icon fa-solid fa-clipboard"></i> -->
				<i
					class="icon fa-solid fa-right-to-bracket"
					onClick="location.href='/'"
				></i>
			</div>
			<div class="sidebar__letters">
				<div class="categories">
					<h3>Categories</h3>
					<button>All</button>
				</div>
			</div>
		</section>
		<div class="logo">AnkiQuestions</div>
		<span class="current-category">All</span>
		<section id="app">
			<form class="editar">
				<div class="titulo">
					<h3>Edit questions</h3>
					<input type="number" class="editarNuevaCategoria" />
				</div>
				<div class="textareas">
					<textarea id="lapregunta"></textarea>
					<textarea class="editarRespuesta"></textarea>
				</div>
				<div class="edit-categorie">
					<label for="edit-categories">Select category:</label>
					<select
						name="categoriacrear"
						id="edit-categories"
						class="editarNuevaCategoria"
					>
						<option value="">Choose the appropriate category</option>
					</select>
				</div>
				<button>Edit question</button>
			</form>
		</section>

		<script type="module" src="./script.js"></script>
	</body>
</html>
